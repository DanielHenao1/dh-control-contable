name: CI
on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16  # espejo de Google: Docker Hub limita las descargas sin autenticar
        env:
          POSTGRES_DB: control
          POSTGRES_USER: control
          POSTGRES_PASSWORD: control
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U control" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Dependencias del sistema (PDF)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: Migraciones sin pendientes
        run: python manage.py makemigrations --check --dry-run
      - name: pytest (SQLite en memoria)
        run: pytest
      - name: pytest contra PostgreSQL
        env:
          DATABASE_URL_PG: postgres://control:control@localhost:5432/control
        run: pytest --ds=config.settings_test_pg
