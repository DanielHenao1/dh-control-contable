<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:6px 0 18px">
{% for f in filas %}<tr>
 <td width="64" valign="top" style="padding:10px 0;border-bottom:1px solid #e3e8f0"><div style="background:{{ f.color }};color:#ffffff;border-radius:8px;text-align:center;padding:6px 0;font-size:12px;line-height:1.3"><b style="font-size:17px">{{ f.fecha|date:"d" }}</b><br>{{ f.fecha|date:"M"|upper }}</div></td>
 <td valign="top" style="padding:10px 0 10px 12px;border-bottom:1px solid #e3e8f0;font-size:14px;line-height:1.45"><b style="color:#14284b">{{ f.nombre }}</b>{% if f.periodo %} <span style="color:#5b6472">{{ f.periodo }}</span>{% endif %}<br><span style="color:{{ f.color }};font-weight:bold">{{ f.cuando }}</span> <span style="color:#7a8494">· {{ f.estado }}</span></td>
</tr>{% endfor %}
</table>
